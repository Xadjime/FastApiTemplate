<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Car</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f8fafc; }
        .card { max-width: 400px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 8px; border: 1px solid #e2e8f0; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #2563eb; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Edit Car</h2>
        <form action="/update_car/{{ car.id }}" method="post">
            <div class="form-group">
                <label for="name">Car Name</label>
                <input type="text" id="name" name="name" value="{{ car.name }}" required>
            </div>
            <div class="form-group">
                <label for="price">Price ($)</label>
                <input type="number" id="price" name="price" value="{{ car.price }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Car</button>
            <a href="/car_list">Cancel</a>
        </form>
    </div>
</body>
</html>
