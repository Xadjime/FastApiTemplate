<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Inventory</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f8fafc; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; }
        .btn { padding: 0.5rem 1rem; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; display: inline-block; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-edit { background: #e2e8f0; color: #0f172a; margin-right: 0.5rem; }
        .btn-danger { background: #ef4444; color: white; }
        .actions { display: flex; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Car Inventory</h1>
            <a href="/add_car" class="btn btn-primary">+ Add New Car</a>
        </div>

        {% if cars %}
            <div class="grid">
                {% for car in cars %}
                    <div class="card">
                        <h3>{{ car.name }}</h3>
                        <p><strong>Price:</strong> ${{ car.price }}</p>
                        <div class="actions">
                            <a href="/update_car/{{ car.id }}" class="btn btn-edit">Edit</a>
                            <form action="/delete_car/{{ car.id }}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p>No cars available in inventory.</p>
        {% endif %}
    </div>
</body>
</html>
